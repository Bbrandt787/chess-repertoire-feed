name: TWIC repertoire check
on:
  schedule:
    - cron: '23 13 * * 2'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/twic.yml'
      - 'scan-twic.py'
      - 'repertoire-positions.json.gz'
permissions:
  contents: read
jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install chess PGN parser
        run: python -m pip install python-chess==1.999
      - name: Check latest TWIC issue
        run: python scan-twic.py
      - name: Upload report and matching games
        uses: actions/upload-artifact@v4
        with:
          name: twic-repertoire-pgn
          path: weekly-output/
          if-no-files-found: error
